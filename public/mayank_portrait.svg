<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <!-- Background studio vignette -->
    <radialGradient id="studioGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#242830" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#14161B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0C0C0C" stop-opacity="1" />
    </radialGradient>

    <!-- Skin gradient -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A882" />
      <stop offset="50%" stop-color="#C6946E" />
      <stop offset="100%" stop-color="#AF7F59" />
    </linearGradient>

    <!-- Skin shadow -->
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C6F4B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#805635" stop-opacity="0.9" />
    </linearGradient>

    <!-- Hoodie shading -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222326" />
      <stop offset="50%" stop-color="#17181A" />
      <stop offset="100%" stop-color="#0E0F11" />
    </linearGradient>

    <!-- Glasses reflection -->
    <linearGradient id="lensGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.05" />
    </linearGradient>

    <!-- Rim light filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio backdrop -->
  <rect width="800" height="900" fill="url(#studioGlow)" />

  <g id="mayank-figure" transform="translate(0, 30)">
    <!-- Shoulders / Torso / Black Hoodie -->
    <g id="hoodie">
      <!-- Outer hoodie body -->
      <path d="M180,900 C180,720 220,600 320,560 L360,550 L440,550 L480,560 C580,600 620,720 620,900 Z" fill="url(#hoodieGrad)" />
      
      <!-- Hoodie folds & shadows -->
      <path d="M220,740 Q280,710 350,720 Q450,710 580,740" stroke="#111214" stroke-width="6" fill="none" opacity="0.7" />
      <path d="M240,820 Q300,790 400,800 Q500,790 560,820" stroke="#0E0F11" stroke-width="8" fill="none" opacity="0.8" />
      
      <!-- Inner T-shirt (Black Crewneck) -->
      <path d="M350,565 Q400,605 450,565 L455,620 Q400,640 345,620 Z" fill="#0A0A0C" />

      <!-- Zipper track -->
      <line x1="400" y1="620" x2="400" y2="900" stroke="#33363D" stroke-width="4" stroke-dasharray="2,2" />
      <circle cx="400" cy="625" r="5" fill="#71717A" />

      <!-- Drawstrings -->
      <path d="M365,575 Q360,650 368,690" stroke="#2B2D31" stroke-width="5" stroke-linecap="round" fill="none" />
      <rect x="365" y="690" width="6" height="16" rx="2" fill="#52525B" />

      <path d="M435,575 Q440,650 432,690" stroke="#2B2D31" stroke-width="5" stroke-linecap="round" fill="none" />
      <rect x="429" y="690" width="6" height="16" rx="2" fill="#52525B" />

      <!-- Hood collar draped around neck -->
      <path d="M305,550 Q340,510 360,545 Q400,560 440,545 Q460,510 495,550 Q460,600 400,600 Q340,600 305,550 Z" fill="#202226" stroke="#141518" stroke-width="3" />
    </g>

    <!-- Neck -->
    <g id="neck">
      <path d="M360,450 L360,555 Q400,575 440,555 L440,450 Z" fill="url(#skinBase)" />
      <!-- Neck shadow under chin -->
      <path d="M360,450 Q400,505 440,450 L440,490 Q400,530 360,490 Z" fill="url(#skinShadow)" />
      <!-- Adam's apple subtle line -->
      <path d="M398,505 Q400,515 402,505" stroke="#9C6F4B" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

    <!-- Head & Ears -->
    <g id="head">
      <!-- Left Ear -->
      <path d="M298,340 C280,340 280,395 302,405 Z" fill="#BA8B66" stroke="#9C6F4B" stroke-width="1.5" />
      <path d="M295,355 Q290,375 298,390" stroke="#875836" stroke-width="2" fill="none" />

      <!-- Right Ear -->
      <path d="M502,340 C520,340 520,395 498,405 Z" fill="#BA8B66" stroke="#9C6F4B" stroke-width="1.5" />
      <path d="M505,355 Q510,375 502,390" stroke="#875836" stroke-width="2" fill="none" />

      <!-- Face Shape -->
      <path d="M305,320 C305,240 330,195 400,195 C470,195 495,240 495,320 C495,395 470,470 400,475 C330,470 305,395 305,320 Z" fill="url(#skinBase)" />

      <!-- Jawline definition -->
      <path d="M320,380 Q340,445 400,475 Q460,445 480,380" fill="none" stroke="#9C6F4B" stroke-width="2" opacity="0.6" />
    </g>

    <!-- Facial Features -->
    <g id="features">
      <!-- Eyebrows -->
      <path d="M335,305 Q360,298 382,306" stroke="#18181B" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M418,306 Q440,298 465,305" stroke="#18181B" stroke-width="7" stroke-linecap="round" fill="none" />

      <!-- Eyes -->
      <!-- Left Eye -->
      <ellipse cx="358" cy="326" rx="14" ry="7" fill="#F8FAFC" />
      <circle cx="360" cy="326" r="6" fill="#2E1C12" />
      <circle cx="360" cy="326" r="3" fill="#09090B" />
      <circle cx="362" cy="324" r="1.5" fill="#FFFFFF" />
      <path d="M344,324 Q358,318 372,324" stroke="#452718" stroke-width="2.5" fill="none" />

      <!-- Right Eye -->
      <ellipse cx="442" cy="326" rx="14" ry="7" fill="#F8FAFC" />
      <circle cx="440" cy="326" r="6" fill="#2E1C12" />
      <circle cx="440" cy="326" r="3" fill="#09090B" />
      <circle cx="442" cy="324" r="1.5" fill="#FFFFFF" />
      <path d="M428,324 Q442,318 456,324" stroke="#452718" stroke-width="2.5" fill="none" />

      <!-- Nose -->
      <path d="M397,315 L394,365 Q394,375 400,378 Q406,375 406,365" stroke="#9C6F4B" stroke-width="2.5" fill="none" stroke-linejoin="round" />
      <!-- Nostrils -->
      <path d="M388,373 Q393,370 398,375" stroke="#784C2C" stroke-width="2" fill="none" />
      <path d="M402,375 Q407,370 412,373" stroke="#784C2C" stroke-width="2" fill="none" />

      <!-- Glasses (Modern Black Rectangular Spectacles from Video) -->
      <g id="spectacles">
        <!-- Bridge -->
        <path d="M384,323 Q400,319 416,323" stroke="#111827" stroke-width="4.5" fill="none" stroke-linecap="round" />
        
        <!-- Left Frame -->
        <rect x="330" y="310" width="56" height="34" rx="8" fill="url(#lensGlint)" stroke="#09090B" stroke-width="5" />
        <!-- Left Temple -->
        <line x1="330" y1="318" x2="296" y2="340" stroke="#111827" stroke-width="4" stroke-linecap="round" />

        <!-- Right Frame -->
        <rect x="414" y="310" width="56" height="34" rx="8" fill="url(#lensGlint)" stroke="#09090B" stroke-width="5" />
        <!-- Right Temple -->
        <line x1="470" y1="318" x2="504" y2="340" stroke="#111827" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- Mustache -->
      <path d="M382,398 Q400,392 418,398 Q410,406 400,404 Q390,406 382,398 Z" fill="#1C1917" opacity="0.9" />

      <!-- Lips -->
      <path d="M384,412 Q400,410 416,412" stroke="#874B39" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M386,414 Q400,424 414,414" stroke="#A75E49" stroke-width="2.5" fill="none" stroke-linecap="round" />

      <!-- Trimmed Beard / Goatee on Chin & Jawline -->
      <path d="M382,430 Q400,438 418,430 Q415,455 400,465 Q385,455 382,430 Z" fill="#18181B" opacity="0.85" />
      <path d="M330,370 Q350,430 380,455" stroke="#1C1917" stroke-width="5" stroke-dasharray="3,2" fill="none" opacity="0.65" />
      <path d="M470,370 Q450,430 420,455" stroke="#1C1917" stroke-width="5" stroke-dasharray="3,2" fill="none" opacity="0.65" />
    </g>

    <!-- Hair (Voluminous Curly Dark Hair from Video) -->
    <g id="curly-hair">
      <!-- Hair Silhouette Base -->
      <path d="M295,330 C270,300 260,220 300,160 C330,110 410,95 470,115 C520,130 550,190 535,260 C530,300 515,335 498,345 C495,270 480,210 450,195 C380,185 330,220 305,330 Z" fill="#141416" />

      <!-- Dynamic Curly Locks & Clusters -->
      <!-- Top clusters -->
      <circle cx="340" cy="140" r="32" fill="#18181B" />
      <circle cx="390" cy="120" r="38" fill="#1C1C20" />
      <circle cx="440" cy="130" r="35" fill="#18181B" />
      <circle cx="480" cy="155" r="32" fill="#1C1C20" />

      <!-- Side curls left -->
      <circle cx="295" cy="190" r="28" fill="#1C1C20" />
      <circle cx="280" cy="240" r="26" fill="#141416" />
      <circle cx="285" cy="285" r="24" fill="#18181B" />
      <circle cx="298" cy="320" r="20" fill="#141416" />

      <!-- Side curls right -->
      <circle cx="510" cy="190" r="28" fill="#18181B" />
      <circle cx="525" cy="240" r="26" fill="#1C1C20" />
      <circle cx="518" cy="285" r="24" fill="#141416" />
      <circle cx="505" cy="325" r="20" fill="#18181B" />

      <!-- Foreground curl details & highlights -->
      <path d="M315,200 Q335,170 355,205 Q375,175 400,200 Q425,170 450,205 Q470,180 485,215" stroke="#2E3036" stroke-width="4.5" fill="none" stroke-linecap="round" />
      <path d="M330,170 Q360,145 385,175 Q410,145 440,170" stroke="#373A42" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <path d="M305,240 Q325,230 320,260" stroke="#2A2C31" stroke-width="3" fill="none" />
      <path d="M485,240 Q475,230 480,260" stroke="#2A2C31" stroke-width="3" fill="none" />
      <path d="M365,130 Q390,110 415,135" stroke="#3D404A" stroke-width="3" fill="none" />
    </g>
  </g>

  <!-- Bottom Dark Vignette / Seamless Fade into Page Background -->
  <rect y="600" width="800" height="300" fill="url(#bottomFade)" />
  <defs>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C0C0C" stop-opacity="0" />
      <stop offset="60%" stop-color="#0C0C0C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0C0C0C" stop-opacity="1" />
    </linearGradient>
  </defs>
</svg>
